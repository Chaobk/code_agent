[project]
name = "code-agent"
version = "0.0.1"
description = "学习型编程 Agent:ReAct 循环 + 工具系统 + 记忆 + 命令行交互"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.75.5,!=1.82.7,!=1.82.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
code-agent = "code_agent.ui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer 的 Option/Argument 默认值必须写成函数调用,这是它的用法约定
"src/code_agent/ui/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
